<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Aditya Pawar, Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="0.55" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BAE6FD"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.06"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="round"><rect width="1000" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)"/>
    <circle cx="180" cy="80" r="110" fill="#38BDF8" opacity="0.35" filter="url(#blur)">
      <animate attributeName="cx" values="180;260;180" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="250" r="120" fill="#6366F1" opacity="0.35" filter="url(#blur)">
      <animate attributeName="cy" values="250;190;250" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>
  <ellipse cx="500" cy="160" rx="380" ry="110" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-dasharray="6 8"/>
  <circle r="6" fill="#FDE68A">
    <animateMotion dur="14s" repeatCount="indefinite" path="M 120 160 a 380 110 0 1 0 760 0 a 380 110 0 1 0 -760 0"/>
  </circle>
  <g font-family="Consolas, Menlo, monospace" font-size="34" fill="#BAE6FD" fill-opacity="0.45">
    <text x="60" y="70">&lt;/&gt;<animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="5s" repeatCount="indefinite"/></text>
    <text x="900" y="70">{ }<animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="6s" repeatCount="indefinite"/></text>
    <text x="70" y="270">( )<animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="7s" repeatCount="indefinite"/></text>
    <text x="890" y="270">=&gt;<animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="5.5s" repeatCount="indefinite"/></text>
  </g>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="500" y="150" font-size="68" font-weight="800" letter-spacing="8" fill="url(#title)">ADITYA PAWAR
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="1.2s" fill="freeze"/>
    </text>
    <text x="500" y="200" font-size="28" font-weight="600" fill="#E0F2FE">Full Stack Developer
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.6s" fill="freeze"/>
    </text>
    <text x="500" y="238" font-family="Consolas, Menlo, monospace" font-size="19" fill="#FDE68A">design  →  build  →  ship
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.1s" fill="freeze"/>
    </text>
  </g>
  <g>
    <rect x="395" y="262" width="210" height="38" rx="19" fill="#FFFFFF"/>
    <circle cx="425" cy="281" r="6" fill="#16A34A">
      <animate attributeName="r" values="5;8;5" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="445" y="287" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#166534">OPEN TO WORK</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
