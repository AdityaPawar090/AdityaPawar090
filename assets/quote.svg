<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" role="img" aria-label="Quote" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/><stop offset="0.5" stop-color="#38BDF8"/><stop offset="1" stop-color="#6366F1"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="994" height="164" rx="20" fill="url(#fill)" stroke="url(#bd)" stroke-width="3"/>
  <text x="50" y="100" font-family="Georgia, serif" font-size="120" fill="#1E3A8A" opacity="0.25">“</text>
  <text x="500" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#0B1F3A">Good software is quiet: it just works,
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/></text>
  <text x="500" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#0B1F3A">and it is a pleasure to use.
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.5s" fill="freeze"/></text>
  <text x="950" y="150" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#2563EB">— MY ENGINEERING MANTRA</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
